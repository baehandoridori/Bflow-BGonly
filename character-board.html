<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bflow · 캐릭터 현황판 온보딩</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   Bflow 캐릭터 현황판 — 시각 온보딩 릴
   실제 앱 토큰 (Violet Dream / Dark) 그대로 사용:
   src/index.css :root + tailwind.config.js
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#0F1117;            /* --color-bg-primary  15 17 23  */
  --card:#1A1D27;          /* --color-bg-card     26 29 39  */
  --bd:#2D3041;            /* --color-bg-border   45 48 65  */
  --tp:#E8E8EE;            /* --color-text-primary          */
  --ts:#8B8DA3;            /* --color-text-secondary        */
  --ac:#6C5CE7;            /* --color-accent                */
  --ac2:#A29BFE;           /* --color-accent-sub            */
  --on-ac:#FFFFFF;
  /* 캐릭터 현황판 단계 색 (index.css --char-stage-*) */
  --st-wait:#8B8DA3; --st-prog:#74B9FF; --st-rig:#6C5CE7;
  --st-fb:#FDCB6E;  --st-done:#A29BFE; --st-comp:#00B894;
  --err:#FF7675;
  --font:'Pretendard Variable',Pretendard,system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{height:100%}
body{
  background:#0A0B10; color:var(--tp); font-family:var(--font);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;overflow:hidden;line-height:1.5;
}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;white-space:nowrap}
input,textarea{font-family:inherit;color:var(--tp)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2D3041;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ─── 무대 ─────────────────────────────────────────── */
#stageWrap{position:relative;flex:0 0 auto}
#stage{
  position:relative;width:1280px;height:720px;overflow:hidden;
  background:var(--bg);border-radius:16px;border:1px solid #23263500;
  box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);
  transform-origin:top left;
}
/* 은은한 배경 그라데이션(앱 GradientBackdrop 느낌) */
#stage::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(620px 420px at 12% -8%, rgba(108,92,231,.10), transparent 60%),
    radial-gradient(700px 480px at 105% 112%, rgba(162,155,254,.08), transparent 60%);
}
/* 카메라(줌 대상): 앱 화면 + 오버레이 모두 포함 */
#camera{position:absolute;inset:0;transform-origin:0 0;will-change:transform;z-index:1}
#world{position:absolute;inset:0}
#ovl{position:absolute;inset:0;pointer-events:none}
#ovl>*{pointer-events:auto}

/* ─── 앱: 캐릭터 현황판 뷰 ────────────────────────── */
.viewCol{position:absolute;inset:0;display:flex;flex-direction:column}
.viewHead{padding:22px 24px 0;display:flex;flex-direction:column;gap:12px;flex:0 0 auto}
.viewHead .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.h1{font-size:20px;font-weight:700;color:var(--tp)}
.hsub{font-size:14px;color:var(--ts);margin-top:2px}
.btnGhost{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:8px;
  padding:8px 12px;font-size:14px;color:var(--ts);transition:.15s}
.btnGhost:hover{border-color:rgba(139,141,163,.4);color:var(--tp)}
.tabRow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--bd);padding-bottom:8px}
.tabBtn{padding:6px 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ts);transition:.15s}
.tabBtn:hover{color:var(--tp);background:rgba(45,48,65,.4)}
.tabBtn.on{background:rgba(108,92,231,.2);color:var(--ac)}

.viewBody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 24px 24px;position:relative}
.toolbar{position:sticky;top:0;z-index:20;margin:0 -24px;padding:14px 24px 12px;
  background:rgba(15,17,23,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;flex-direction:column;gap:10px}

/* 사용자 정의 탭 스트립 (피드백 41) */
.bstrip{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.bchip{padding:4px 10px;border-radius:999px;font-size:12px;border:1px solid var(--bd);
  color:var(--ts);transition:.15s;display:inline-flex;align-items:center;gap:5px}
.bchip:hover{color:var(--tp)}
.bchip.on{border-color:var(--ac);background:rgba(108,92,231,.15);color:var(--ac)}
.bchip.addTab{border-style:dashed;gap:4px}
.bchip.addTab:hover{border-color:rgba(108,92,231,.5)}
.bstripInput{width:112px;background:transparent;border:1px solid var(--bd);border-radius:999px;
  padding:4px 10px;font-size:12px;outline:none}
.bstripInput:focus,.bstripInput.hot{border-color:rgba(108,92,231,.5)}
.tabDelWrap{display:inline-flex;align-items:center}
.tabX{margin-left:2px;border-radius:5px;padding:3px;color:var(--ts);display:inline-flex}
.tabX:hover{color:var(--tp);background:rgba(45,48,65,.3)}
.confirmDel{margin-left:4px;display:inline-flex;align-items:center;gap:4px;font-size:12px}
.confirmDel .del{color:var(--err);padding:2px 6px;border-radius:5px}
.confirmDel .del:hover,.confirmDel .keep:hover{background:rgba(45,48,65,.3)}
.confirmDel .keep{color:var(--ts);padding:2px 6px;border-radius:5px}

/* 검색 + 버튼 줄 */
.tools2{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.searchBox{position:relative;width:100%;max-width:320px}
.searchBox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ts)}
.searchBox input{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;
  padding:8px 12px 8px 32px;font-size:14px;outline:none;transition:border-color .15s}
.searchBox input:focus,.searchBox input.hot{border-color:rgba(108,92,231,.5)}
.toolsR{display:flex;align-items:center;gap:6px}
.vseg{display:flex;align-items:center;border:1px solid var(--bd);border-radius:8px;padding:2px;flex:0 0 auto;transition:opacity .2s}
.vseg.dis{opacity:.45}
.vbtn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:var(--ts);transition:.15s}
.vbtn:hover{color:var(--tp)}
.vbtn.on{background:rgba(108,92,231,.2);color:var(--ac)}
.tbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:8px;
  padding:8px 12px;font-size:14px;color:var(--ts);transition:.15s;flex:0 0 auto}
.tbtn:hover{border-color:rgba(139,141,163,.4);color:var(--tp)}
.tbtn.on{border-color:rgba(108,92,231,.5);background:rgba(108,92,231,.15);color:var(--ac)}
.btnPrimary{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;
  background:var(--ac);color:#fff;font-size:14px;flex:0 0 auto;transition:opacity .15s}
.btnPrimary:hover{opacity:.9}

/* 태그 필터 칩 (태그별 고유색) */
.tagRow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tagpill{padding:4px 10px;border-radius:999px;font-size:12px;border:1px solid var(--bd);
  color:var(--ts);display:inline-flex;align-items:center;gap:6px;transition:.2s;background:transparent}
.tagpill .dot{width:8px;height:8px;border-radius:999px;flex:0 0 auto;opacity:.55}
.tagpill.on .dot{opacity:1}
.clearTags{font-size:12px;color:var(--ts);padding:0 6px}
.clearTags:hover{color:var(--tp)}

/* ─── 캐릭터 카드 그리드 ─────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding-top:4px}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.listWrap{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.lineup{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;padding-top:4px}

.ccard{position:relative;text-align:left;background:var(--card);border:1px solid var(--bd);
  border-radius:12px;display:flex;flex-direction:column;cursor:pointer;
  transition:transform .2s ease-out,opacity .2s ease-out,border-color .2s ease-out}
.ccard:hover{border-color:rgba(108,92,231,.5)}
.ccard.dragSrc{opacity:.3;transform:scale(.97)}
.ccard.dropHi{border-color:rgba(108,92,231,.6)}
.ccard .imgBox{position:relative;aspect-ratio:3/4;background:rgba(45,48,65,.3);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  border-radius:12px 12px 0 0}
.ccard .imgBox svg.art{width:100%;height:100%;display:block}
.ccard .imgBox .noimg{color:rgba(139,141,163,.4)}
.wheelDots{position:absolute;left:0;right:0;bottom:6px;display:flex;align-items:center;
  justify-content:center;gap:4px;pointer-events:none}
.wheelDots i{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.4);transition:background .15s}
.wheelDots i.on{background:var(--ac)}
.hBadge{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.5);border-radius:4px;
  padding:2px 6px;font-size:10px;color:rgba(255,255,255,.8);pointer-events:none}
.ccard .info{padding:12px;display:flex;flex-direction:column;gap:8px}
.ccard .nm{font-weight:600;font-size:14px;color:var(--tp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ts)}
.badges{display:flex;align-items:center;gap:6px;font-size:11px}
.bdgD{padding:2px 6px;border-radius:6px;background:rgba(162,155,254,.14);color:var(--st-done)}
.bdgR{padding:2px 6px;border-radius:6px;background:rgba(0,184,148,.14);color:var(--st-comp)}
.bdgEmpty{align-self:flex-start;padding:2px 6px;border-radius:6px;background:rgba(45,48,65,.3);
  font-size:11px;color:var(--ts)}
.dropLine{position:absolute;top:8px;bottom:8px;width:3px;border-radius:999px;background:var(--ac);
  box-shadow:0 0 10px 1px rgba(108,92,231,.7);z-index:3;pointer-events:none;
  animation:pulseA 1s ease-in-out infinite}
.dropLine.before{left:-9px}.dropLine.after{right:-9px}
@keyframes pulseA{0%,100%{opacity:1}50%{opacity:.45}}
.ccard.pop{animation:popIn .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{0%{opacity:0;transform:scale(.85) translateY(8px)}100%{opacity:1;transform:none}}

/* 리스트 보기 행 */
.crow{display:flex;width:100%;align-items:center;gap:12px;border:1px solid var(--bd);
  background:var(--card);border-radius:8px;padding:8px 12px;text-align:left;cursor:pointer;
  transition:border-color .15s}
.crow:hover{border-color:rgba(108,92,231,.5)}
.crow .th{width:40px;height:40px;flex:0 0 auto;border-radius:6px;background:rgba(45,48,65,.3);
  overflow:hidden;display:flex;align-items:center;justify-content:center}
.crow .th svg.art{width:100%;height:100%}
.crow .mid{min-width:0;flex:1}
.crow .mid .nm{font-weight:500;font-size:14px;color:var(--tp)}
.crow .mid .sub{font-size:12px;color:var(--ts)}

/* 탭 그룹 섹션 */
.gsec{border:1px solid rgba(45,48,65,.6);border-radius:12px;padding:12px;display:flex;
  flex-direction:column;gap:12px;transition:border-color .2s}
.gsec.dragOver{border-color:rgba(108,92,231,.4)}
.gsec header{display:flex;align-items:center;gap:8px}
.gsec .gnm{font-size:14px;font-weight:600;color:var(--tp)}
.gsec .gcnt{font-size:12px;color:var(--ts)}
.gIco{border-radius:5px;padding:4px;color:var(--ts);display:inline-flex}
.gIco:hover{color:var(--tp);background:rgba(45,48,65,.3)}
.gEmpty{border:1px dashed rgba(45,48,65,.7);border-radius:8px;padding:24px 12px;text-align:center;
  font-size:12px;color:var(--ts)}
.groupsCol{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.addGroupBtn{align-self:flex-start;display:flex;align-items:center;gap:6px;border:1px dashed var(--bd);
  border-radius:8px;padding:8px 12px;font-size:14px;color:var(--ts)}
.addGroupBtn:hover{border-color:rgba(108,92,231,.5);color:var(--tp)}
.groupInputRow{display:flex;align-items:center;gap:8px}
.groupInputRow input{background:transparent;border:1px solid var(--bd);border-radius:6px;
  padding:8px 12px;font-size:14px;outline:none}
.groupInputRow input.hot{border-color:rgba(108,92,231,.5)}
.groupInputRow .ok{background:var(--ac);border-radius:8px;padding:8px 12px;color:#fff;display:flex}

/* 빈 상태 */
.emptyState{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:64px 0;text-align:center;color:var(--ts);font-size:14px}

/* ─── 모달 공통 ──────────────────────────────────── */
.mOverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);padding:24px;z-index:30;opacity:0;transition:opacity .2s ease-out}
.mOverlay.show{opacity:1}
.mOverlay.blurred{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);background:rgba(0,0,0,.6)}

/* 캐릭터 추가 모달 */
.addCard{background:var(--card);border:1px solid var(--bd);border-radius:16px;width:100%;
  max-width:448px;padding:20px;display:flex;flex-direction:column;gap:16px;
  transform:scale(.96);transition:transform .2s ease-out}
.mOverlay.show .addCard{transform:scale(1)}
.addCard h2{font-size:18px;font-weight:600}
.fld{display:flex;flex-direction:column;gap:6px}
.fld .lb{font-size:12px;color:var(--ts)}
.fld input,.fld textarea{background:transparent;border:1px solid var(--bd);border-radius:6px;
  padding:8px 12px;font-size:14px;outline:none;resize:none}
.fld input.hot,.fld input:focus,.fld textarea:focus{border-color:rgba(108,92,231,.5)}
.fld .hint{font-size:11px;color:var(--ts)}
.fld .warn{font-size:11px;color:var(--st-fb)}
.mBtns{display:flex;justify-content:flex-end;gap:8px}
.mBtns .cancel{padding:6px 12px;border-radius:8px;font-size:14px;color:var(--ts)}
.mBtns .cancel:hover{background:rgba(45,48,65,.4)}
.mBtns .go{padding:6px 12px;border-radius:8px;font-size:14px;background:var(--ac);color:#fff}

/* ─── 캐릭터 상세 모달 (마스터-디테일) ───────────── */
.dRow{display:flex;align-items:stretch;gap:12px;height:634px;max-width:100%}
.dShell{position:relative;display:flex;height:100%;width:1024px;flex:0 0 auto;overflow:hidden;
  border-radius:18px;border:1px solid var(--bd);background:var(--card);
  box-shadow:0 40px 80px rgba(0,0,0,.5);
  transform:scale(.97);transition:transform .22s ease-out}
.mOverlay.show .dShell{transform:scale(1)}
.dGlow{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.dGlow i{position:absolute;border-radius:999px;filter:blur(40px)}
.dGlow .a{top:-100px;left:-100px;width:400px;height:400px;
  background:radial-gradient(circle,rgba(108,92,231,.16) 0%,transparent 60%)}
.dGlow .b{bottom:-150px;right:-100px;width:500px;height:500px;filter:blur(50px);
  background:radial-gradient(circle,rgba(162,155,254,.12) 0%,transparent 60%)}
.dAside{position:relative;z-index:1;width:200px;flex:0 0 auto;border-right:1px solid rgba(45,48,65,.6);
  display:flex;flex-direction:column;min-height:0}
.dAsideHead{padding:12px;border-bottom:1px solid rgba(45,48,65,.4);flex:0 0 auto}
.dCloseTxt{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ts)}
.dCloseTxt:hover{color:var(--tp)}
.dSearch{position:relative;margin-top:12px}
.dSearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ts)}
.dSearch input{width:100%;border:1px solid var(--bd);background:rgba(45,48,65,.15);border-radius:8px;
  padding:6px 8px 6px 28px;font-size:12px;outline:none}
.dSearch input:focus{border-color:rgba(108,92,231,.5)}
.dList{flex:1;min-height:0;overflow-y:auto;padding:6px 0}
.dItem{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;
  border-left:2px solid transparent;transition:.15s;cursor:pointer}
.dItem:hover{background:rgba(45,48,65,.3)}
.dItem.on{border-left-color:var(--ac);background:rgba(108,92,231,.1)}
.dItem .th{width:32px;height:32px;border-radius:6px;background:rgba(45,48,65,.4);overflow:hidden;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.dItem .th svg.art{width:100%;height:100%}
.dItem .col{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.dItem .nm{font-size:13px;color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dItem.on .nm{color:var(--tp);font-weight:500}
.dItem .pbar{height:4px;border-radius:999px;background:rgba(45,48,65,.6);overflow:hidden}
.dItem .pbar i{display:block;height:100%;border-radius:999px;background:var(--st-comp);
  transform-origin:left;transition:transform .2s ease-out}
.dAddChar{flex:0 0 auto;border-top:1px solid rgba(45,48,65,.4);padding:6px}
.dAddChar button{width:100%;display:flex;align-items:center;gap:6px;border-radius:6px;
  padding:8px 10px;font-size:14px;color:var(--ts);transition:.15s}
.dAddChar button:hover{background:rgba(45,48,65,.3);color:var(--ac)}
.dMain{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column}
.dHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;
  border-bottom:1px solid rgba(45,48,65,.4);flex:0 0 auto;
  background:rgba(255,255,255,.015);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.dTitle{display:flex;align-items:center;gap:8px;min-width:0}
.dTitle h2{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dNameInput{background:transparent;border:1px solid rgba(108,92,231,.5);border-radius:6px;
  padding:4px 8px;font-size:18px;font-weight:600;outline:none;width:180px}
.icoBtn{border-radius:6px;padding:6px;color:var(--ts);display:inline-flex;transition:.15s}
.icoBtn:hover{background:rgba(45,48,65,.3);color:var(--tp)}
.dHeadR{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.cmtBtn{display:flex;align-items:center;gap:4px;font-size:14px;padding:4px 8px;border-radius:6px;
  color:var(--ts);transition:.15s}
.cmtBtn:hover{color:var(--tp)}
.cmtBtn.on{background:rgba(108,92,231,.15);color:var(--ac)}
.archBtn{display:flex;align-items:center;gap:4px;font-size:14px;padding:6px 8px;border-radius:6px;color:var(--ts)}
.archBtn:hover{background:rgba(45,48,65,.3);color:#FFB86B}
.restoreBtn{display:flex;align-items:center;gap:4px;font-size:14px;padding:6px 8px;border-radius:6px;color:var(--ts)}
.restoreBtn:hover{background:rgba(45,48,65,.3);color:var(--tp)}
.delBtn{display:flex;align-items:center;gap:4px;font-size:14px;padding:6px 8px;border-radius:6px;color:var(--ts)}
.delBtn:hover{background:rgba(255,118,117,.1);color:var(--err)}
.dBody{flex:1;min-height:0;overflow-y:auto;padding:20px}
.dCols{display:flex;gap:24px}
.dLeft{width:240px;flex:0 0 auto;display:flex;flex-direction:column;gap:12px}
.featBox{position:relative;aspect-ratio:3/4;width:240px;border-radius:12px;border:1px solid var(--bd);
  overflow:hidden;cursor:zoom-in;background:rgba(45,48,65,.18);transition:border-color .15s}
.featBox:hover{border-color:rgba(108,92,231,.5)}
.featBox svg.art{width:100%;height:100%;display:block}
.featBox.dropHot{border-color:var(--ac);background:rgba(108,92,231,.1)}
.dropVeil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  border-radius:12px;background:rgba(108,92,231,.15);box-shadow:inset 0 0 0 1px rgba(108,92,231,.6);
  font-size:12px;font-weight:500;color:var(--ac);opacity:0;transition:opacity .15s;pointer-events:none}
.featBox.dropHot .dropVeil{opacity:1}
.featEmpty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  width:100%;height:100%;color:var(--ts);font-size:12px}
.featEmpty .tiny{font-size:10px;color:rgba(139,141,163,.7)}
.featActs{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.fAct{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);
  border-radius:6px;padding:6px 8px;font-size:12px;color:var(--ts);transition:.15s}
.fAct:hover{color:var(--tp);border-color:rgba(139,141,163,.5)}
.fAct .starOn{color:#FCD34D}
.thumbStrip{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding-bottom:4px}
.tThumb{width:56px;flex:0 0 auto;aspect-ratio:3/4;border-radius:6px;border:1px solid var(--bd);
  overflow:hidden;background:rgba(45,48,65,.25);cursor:pointer;transition:border-color .15s;position:relative}
.tThumb svg.art{width:100%;height:100%}
.tThumb.on{border-color:var(--ac);box-shadow:0 0 0 1px rgba(108,92,231,.4)}
.tAdd{width:56px;flex:0 0 auto;aspect-ratio:3/4;border:1px dashed var(--bd);border-radius:6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--ts);font-size:10px}
.tAdd:hover{color:var(--ac);border-color:rgba(108,92,231,.5)}
.costIdent{width:240px;display:flex;flex-direction:column;gap:8px}
.costIdent .r1{display:flex;align-items:center;gap:6px}
.costIdent .cnm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.costIdent .cv{font-size:11px;color:var(--ts);flex:0 0 auto}
.costNameInput{flex:1;min-width:0;background:transparent;border:1px solid rgba(108,92,231,.5);
  border-radius:6px;padding:2px 6px;font-size:14px;font-weight:500;outline:none}
.costMemo{width:100%;min-height:64px;background:rgba(45,48,65,.12);border:1px solid var(--bd);
  border-radius:8px;padding:8px 10px;font-size:12px;color:var(--tp);outline:none;resize:none;line-height:1.5}
.costMemo:focus{border-color:rgba(108,92,231,.5)}
.costMemo::placeholder{color:rgba(139,141,163,.6)}

.dRight{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
.secLb{font-size:12px;color:var(--ts)}
.chipsWrap{display:flex;flex-wrap:wrap;gap:6px}
.epUnit{display:flex;align-items:center;gap:4px}
.epChip{min-height:28px;border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font-size:12px;
  color:var(--ts);transition:.15s}
.epChip:hover{color:var(--tp)}
.epChip.on{background:rgba(108,92,231,.2);color:var(--ac);border-color:rgba(108,92,231,.4)}
.epChip.taken{border-style:dashed;color:rgba(139,141,163,.6)}
.reelBtn{min-height:28px;min-width:28px;display:flex;align-items:center;justify-content:center;
  border:1px dashed rgba(45,48,65,.8);border-radius:6px;color:var(--ts);transition:.15s}
.reelBtn.has{border-style:solid;border-color:var(--bd);background:rgba(45,48,65,.15)}
.reelBtn:hover{color:var(--tp)}

/* 복장 갤러리 */
.gallery{display:flex;align-items:stretch;gap:10px;overflow-x:auto;padding:0 8px 4px}
.gcard{position:relative;width:104px;flex:0 0 auto;display:flex;flex-direction:column;
  border-radius:8px;border:1px solid var(--bd);cursor:pointer;
  transition:transform .15s ease-out,opacity .15s ease-out,border-color .15s ease-out}
.gcard:hover{border-color:rgba(139,141,163,.5)}
.gcard.on{border-color:var(--ac);box-shadow:0 0 0 1px rgba(108,92,231,.4)}
.gcard.dragSrc{opacity:.3;transform:scale(.96)}
.gcard .gi{aspect-ratio:3/4;width:100%;background:rgba(45,48,65,.3);display:flex;align-items:center;
  justify-content:center;overflow:hidden;border-radius:8px 8px 0 0}
.gcard .gi svg.art{width:100%;height:100%}
.gcard .gl{display:flex;align-items:center;justify-content:space-between;gap:4px;
  padding:6px 8px;background:var(--card);border-radius:0 0 8px 8px}
.gcard .gl .n{font-size:12px;color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard.on .gl .n{color:var(--tp)}
.gcard .gl .v{font-size:11px;color:var(--ts);flex:0 0 auto}
.gcard .grip{position:absolute;left:4px;top:4px;z-index:1;border-radius:4px;background:rgba(0,0,0,.4);
  padding:2px;color:rgba(255,255,255,.8);opacity:0;transition:opacity .15s}
.gcard:hover .grip{opacity:1}
.gcard .gdel{position:absolute;top:4px;right:4px;border-radius:6px;background:rgba(0,0,0,.4);
  padding:5px;color:rgba(255,255,255,.8);opacity:0;transition:.15s}
.gcard:hover .gdel{opacity:1}
.gcard .gdel:hover{color:#F87171}
.gAdd{width:104px;flex:0 0 auto;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;border:1px dashed var(--bd);border-radius:8px;color:var(--ts);font-size:12px}
.gAdd:hover{color:var(--ac);border-color:rgba(108,92,231,.5)}
.gDropLine{position:absolute;top:2px;bottom:2px;width:3px;border-radius:999px;background:var(--ac);
  box-shadow:0 0 8px 1px rgba(108,92,231,.7);z-index:3;animation:pulseA 1s ease-in-out infinite}
.gDropLine.before{left:-7px}.gDropLine.after{right:-7px}

/* 복장 상세 (CostumeDetail) */
.cdWrap{display:flex;flex-direction:column;gap:20px}
.cdTopRow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px}
.stepper{display:flex;align-items:center;gap:8px}
.stBtn{width:32px;height:32px;border:1px solid var(--bd);border-radius:6px;color:var(--tp);
  font-size:16px;display:flex;align-items:center;justify-content:center}
.stBtn:hover{background:rgba(45,48,65,.4)}
.verInput{width:56px;height:32px;text-align:center;border:1px solid var(--bd);border-radius:6px;
  background:transparent;font-size:14px;outline:none;font-variant-numeric:tabular-nums}
.dateInput,.hpxInput{height:32px;border:1px solid var(--bd);border-radius:6px;background:transparent;
  padding:0 8px;font-size:14px;outline:none;color-scheme:dark}
.dateInput:focus,.hpxInput:focus,.dateInput.hot,.hpxInput.hot{border-color:rgba(108,92,231,.5)}
.hpxInput{width:96px}
.fitBtn{height:32px;border:1px solid var(--bd);border-radius:6px;padding:0 8px;font-size:12px;color:var(--ts)}
.fitBtn:hover{border-color:rgba(108,92,231,.5);color:var(--ac)}
.pathGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pathRow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:1px solid rgba(45,48,65,.7);background:rgba(45,48,65,.1);border-radius:8px;padding:8px 12px}
.pathRow .pl{min-width:0}
.pathRow .plb{font-size:12px;color:var(--ts)}
.pathRow .pv{font-size:13px;color:var(--tp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pathRow .pv.none{color:rgba(139,141,163,.7)}
.pathActs{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.pBtn{border:1px solid var(--bd);border-radius:6px;padding:6px 8px;font-size:12px;color:var(--ts)}
.pBtn:hover{color:var(--tp);border-color:rgba(139,141,163,.5)}
.pBtn.mk{border-color:rgba(108,92,231,.4);color:var(--ac)}
.pBtn.mk:hover{background:rgba(108,92,231,.1)}
.railsBox{display:flex;flex-direction:column;gap:20px;border:1px solid rgba(45,48,65,.6);
  background:rgba(45,48,65,.1);border-radius:12px;padding:16px}
.railHr{height:1px;background:rgba(45,48,65,.5)}
.rail{display:flex;flex-direction:column;gap:10px}
.railHead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.railHead .lb{font-size:12px;color:var(--ts)}
.railHead .cur{font-size:12px;font-weight:500}
.railTrack{display:flex;align-items:flex-start}
.stg{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.stg .link{position:absolute;top:9px;height:2px;left:-50%;width:100%;background:var(--bd);z-index:0;
  transition:background .25s}
.stg .node{position:relative;z-index:1;width:18px;height:18px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;background:var(--card);
  border:2px solid var(--bd);transition:background-color .2s,border-color .2s,box-shadow .2s}
.stg .node .core{width:6px;height:6px;border-radius:999px;background:#fff;display:none}
.stg .node svg{display:none;color:#fff}
.stg .slb{font-size:11px;line-height:1.2;text-align:center;color:var(--ts);transition:color .2s}
.assPick{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--bd);border-radius:999px;
  padding:3px 10px;font-size:12px;color:var(--ts);transition:.15s}
.assPick:hover{color:var(--tp);border-color:rgba(139,141,163,.5)}
.assChip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;
  font-size:12px}
.assChip .adot{width:6px;height:6px;border-radius:999px}
.announceBtn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;
  border:1px solid rgba(108,92,231,.4);border-radius:8px;padding:6px 12px;font-size:12px;
  font-weight:500;color:var(--ac)}
.announceBtn:hover{background:rgba(108,92,231,.1)}
.tagSec{display:flex;flex-direction:column;gap:8px}
.tagAddWrap{display:inline-flex;align-items:center;gap:4px}
.tagAddWrap input{width:80px;background:transparent;border:1px solid var(--bd);border-radius:999px;
  padding:4px 8px;font-size:12px;outline:none}
.tagAddWrap input:focus{border-color:rgba(108,92,231,.5)}

/* 댓글 패널 */
.cmtPanel{width:300px;flex:0 0 auto;height:100%;border-radius:18px;border:1px solid var(--bd);
  background:var(--card);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 40px 80px rgba(0,0,0,.5);animation:slideL .35s cubic-bezier(.22,1,.36,1)}
@keyframes slideL{0%{opacity:0;transform:translateX(24px)}100%{opacity:1;transform:none}}
.cmtHead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  border-bottom:1px solid rgba(45,48,65,.4);font-size:13px;font-weight:600}
.cmtBody{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.cmtItem{display:flex;gap:8px}
.cmtAv{width:26px;height:26px;border-radius:999px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;color:#fff}
.cmtCol{display:flex;flex-direction:column;gap:3px;min-width:0}
.cmtMeta{font-size:11px;color:var(--ts)}
.cmtMeta b{color:var(--tp);font-weight:600}
.cmtTxt{font-size:12px;color:var(--tp);background:rgba(45,48,65,.25);border-radius:0 10px 10px 10px;
  padding:7px 10px;line-height:1.5}
.cmtInput{border-top:1px solid rgba(45,48,65,.4);padding:10px 12px}
.cmtInput .box{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:12px;
  color:rgba(139,141,163,.7)}

/* 라이트박스 (크게 보기) */
.lightbox{position:absolute;inset:0;z-index:40;background:rgba(4,5,9,.88);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  opacity:0;transition:opacity .25s}
.lightbox.show{opacity:1}
.lbImg{height:520px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#05060a;
  border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 70px rgba(0,0,0,.6)}
.lbImg svg.art{width:100%;height:100%}
.lbCap{font-size:13px;color:var(--ts)}
.lbClose{position:absolute;top:16px;right:16px;border-radius:8px;padding:8px;color:var(--ts);
  background:rgba(45,48,65,.3)}
.lbClose:hover{color:var(--tp)}

/* 컨텍스트 메뉴 */
.ctxMenu{position:absolute;z-index:46;min-width:168px;background:#171A24;border:1px solid var(--bd);
  border-radius:10px;padding:5px;box-shadow:0 18px 50px rgba(0,0,0,.55);
  display:flex;flex-direction:column;gap:1px;opacity:0;transform:scale(.95);transform-origin:top left;
  transition:.15s ease-out}
.ctxMenu.show{opacity:1;transform:scale(1)}
.ctxItem{display:flex;align-items:center;gap:8px;border-radius:6px;padding:7px 9px;font-size:12px;
  color:var(--tp);text-align:left}
.ctxItem:hover{background:rgba(108,92,231,.15)}
.ctxItem.dim{color:rgba(139,141,163,.55)}
.ctxHr{height:1px;background:rgba(45,48,65,.7);margin:3px 4px}
.ctxLb{font-size:10px;color:var(--ts);padding:4px 9px 2px}

/* 담당자 피커 미니 모달 */
.assModal{position:absolute;inset:0;z-index:44;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s}
.assModal.show{opacity:1}
.assCard{width:340px;background:var(--card);border-radius:16px;padding:16px;
  box-shadow:0 0 0 1px rgba(255,255,255,.1),0 30px 70px rgba(0,0,0,.5)}
.assCard .ttl{font-size:14px;font-weight:600}
.assCard .sub{font-size:12px;color:var(--ts);margin-top:2px}
.assCard input{width:100%;margin-top:12px;border:1px solid var(--bd);background:rgba(45,48,65,.1);
  border-radius:10px;padding:8px 12px;font-size:14px;outline:none}
.assList{margin-top:8px;border:1px solid rgba(45,48,65,.7);background:rgba(45,48,65,.1);
  border-radius:10px;overflow:hidden}
.assRow{display:flex;width:100%;align-items:center;gap:8px;padding:8px 12px;font-size:14px;
  text-align:left;transition:.12s}
.assRow:hover,.assRow.hi{background:rgba(108,92,231,.15)}
.assRow .adot{width:8px;height:8px;border-radius:999px;flex:0 0 auto}

/* 토스트 */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);
  z-index:52;background:#191C28;border:1px solid var(--bd);border-radius:10px;
  padding:9px 14px;font-size:12px;color:var(--tp);display:flex;align-items:center;gap:10px;
  box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;transition:.3s cubic-bezier(.22,1,.36,1);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .tAct{color:var(--ac);font-weight:600}

/* ═══ 연출 레이어 (스포트라이트 / 커서 / 자막) ═══ */
#fx{position:absolute;inset:0;z-index:50;pointer-events:none}
.fstrip{position:absolute;background:rgba(6,7,12,.6);backdrop-filter:blur(2.5px);
  -webkit-backdrop-filter:blur(2.5px);opacity:0;transition:opacity .4s}
#fx.focusOn .fstrip{opacity:1}
.fring{position:absolute;border:2px solid var(--ac);border-radius:12px;opacity:0;
  box-shadow:0 0 0 4px rgba(108,92,231,.22),0 0 28px rgba(108,92,231,.5),
             inset 0 0 22px rgba(108,92,231,.12);
  transition:opacity .35s}
#fx.focusOn .fring{opacity:1;animation:ringPulse 1.8s ease-in-out infinite}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 4px rgba(108,92,231,.22),0 0 28px rgba(108,92,231,.5),inset 0 0 22px rgba(108,92,231,.12)}
  50%{box-shadow:0 0 0 7px rgba(108,92,231,.1),0 0 40px rgba(108,92,231,.65),inset 0 0 22px rgba(108,92,231,.18)}}
.fbeamWrap{position:absolute;overflow:hidden;border-radius:12px;opacity:0}
.fbeam{position:absolute;top:-30%;bottom:-30%;width:34%;
  background:linear-gradient(105deg,transparent 0%,rgba(255,255,255,.14) 45%,rgba(162,155,254,.28) 50%,rgba(255,255,255,.14) 55%,transparent 100%);
  transform:skewX(-14deg)}
.vignette{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;
  background:radial-gradient(ellipse at center,transparent 52%,rgba(5,6,10,.55) 100%)}
#fx.focusOn .vignette{opacity:1}

/* 콜아웃 라벨 */
.co{position:absolute;z-index:55;display:flex;align-items:center;gap:0;opacity:0;pointer-events:none}
.co .line{height:1.5px;background:linear-gradient(90deg,var(--ac2),rgba(162,155,254,.15));width:34px;flex:0 0 auto;position:relative}
.co .line::before{content:'';position:absolute;left:-3px;top:-2.5px;width:7px;height:7px;border-radius:99px;
  background:var(--ac2);box-shadow:0 0 10px rgba(162,155,254,.9)}
.co.left{flex-direction:row-reverse}
.co.left .line{background:linear-gradient(270deg,var(--ac2),rgba(162,155,254,.15))}
.co.left .line::before{left:auto;right:-3px}
.co .tag{background:rgba(23,26,38,.96);border:1px solid rgba(108,92,231,.45);border-radius:8px;
  padding:5px 10px;font-size:12px;color:var(--tp);white-space:nowrap;
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
.co .tag b{color:var(--ac2);font-weight:600}

/* 가짜 커서 */
#cursor{position:absolute;left:0;top:0;z-index:60;pointer-events:none;will-change:transform}
#cursor .halo{position:absolute;left:-13px;top:-12px;width:44px;height:44px;border-radius:999px;
  background:radial-gradient(circle,rgba(108,92,231,.35) 0%,rgba(108,92,231,0) 65%);
  transition:transform .18s,opacity .18s}
#cursor.press .halo{transform:scale(.62);opacity:.9}
#cursor .glyph{position:relative;display:block;transform-origin:4px 3px;transition:transform .13s cubic-bezier(.34,1.56,.64,1);
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.55))}
#cursor.press .glyph{transform:scale(.8)}
#cursor .grab{position:absolute;left:-4px;top:-2px;opacity:0;transition:opacity .12s}
#cursor.grabbing .glyph{opacity:0}
#cursor.grabbing .grab{opacity:1}
.ripple{position:absolute;z-index:58;width:14px;height:14px;border-radius:999px;
  border:2px solid rgba(162,155,254,.9);pointer-events:none}
.dragGhost{position:absolute;z-index:59;pointer-events:none;width:92px;border-radius:10px;
  border:1px solid rgba(108,92,231,.5);background:#1A1D27F0;overflow:hidden;
  box-shadow:0 16px 40px rgba(0,0,0,.55);transform:rotate(3deg);opacity:0;transition:opacity .15s}
.dragGhost .gi{aspect-ratio:3/4;background:rgba(45,48,65,.3)}
.dragGhost .gi svg{width:100%;height:100%}
.dragGhost .gn{padding:4px 8px;font-size:11px;color:var(--tp);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;background:#141722}
.fileChip{position:absolute;z-index:59;pointer-events:none;display:flex;align-items:center;gap:7px;
  background:#1E2230F5;border:1px solid rgba(116,185,255,.5);border-radius:10px;padding:7px 11px;
  font-size:12px;color:var(--tp);box-shadow:0 14px 36px rgba(0,0,0,.5);opacity:0;transform:rotate(-2deg)}
.fileChip svg{color:#74B9FF}

/* 자막 (캡션) */
#cap{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:65;
  width:min(780px,92%);pointer-events:none}
.capCard{background:rgba(16,18,28,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(108,92,231,.28);border-radius:14px;padding:12px 18px;
  box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.capKick{font-size:10.5px;letter-spacing:.14em;color:var(--ac2);font-weight:700;
  text-transform:uppercase;display:flex;align-items:center;gap:8px}
.capKick .no{background:rgba(108,92,231,.2);border:1px solid rgba(108,92,231,.4);
  border-radius:5px;padding:1px 6px;font-variant-numeric:tabular-nums}
.capTitle{font-size:15px;font-weight:700;color:var(--tp);margin-top:3px}
.capText{font-size:13px;color:#B9BBCC;margin-top:2px;line-height:1.55}
.capText b{color:var(--tp);font-weight:600}
.capText .kbd{display:inline-block;border:1px solid var(--bd);border-bottom-width:2px;border-radius:4px;
  background:#141722;padding:0 5px;font-size:11px;color:var(--ac2);margin:0 1px}

/* 인트로/아웃트로 */
.gate{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;background:radial-gradient(900px 600px at 50% 20%,#171A28 0%,#0D0F16 60%,#0A0B10 100%);
  transition:opacity .5s,visibility .5s}
.gate.hide{opacity:0;visibility:hidden}
.gate .blob{position:absolute;border-radius:999px;filter:blur(60px);pointer-events:none}
.gate .b1{top:-120px;left:-80px;width:460px;height:460px;background:radial-gradient(circle,rgba(108,92,231,.25),transparent 65%)}
.gate .b2{bottom:-160px;right:-100px;width:540px;height:540px;background:radial-gradient(circle,rgba(162,155,254,.16),transparent 65%)}
.gKick{font-size:12px;letter-spacing:.32em;color:var(--ac2);font-weight:700}
.gTitle{font-size:44px;font-weight:800;margin-top:14px;letter-spacing:-.01em;

function artOf(costume, h, back){
  if (!costume || !costume.art) return null;
  const [who, variant] = costume.art;
  const fn = ART[who] && ART[who][variant];
  return fn ? fn(h || 600, !!back) : null;
}

function findChar(id){ return W.chars.find(c=>c.id===id) || W.arch.find(c=>c.id===id) || null; }
function featuredCostume(ch){
  const imaged = ch.costumes.filter(k=>k.art);
  const idx = W.cardIdx[ch.id] || 0;
  return imaged[idx] || imaged[0] || null;
}
function charAllTags(ch){
  const s = new Set();
  ch.costumes.forEach(k=>{ k.sTags.forEach(t=>s.add(t)); k.aTags.forEach(t=>s.add(t)); });
  return s;
}
function allBoardTags(){
  const s = new Set();
  W.chars.forEach(ch=>charAllTags(ch).forEach(t=>s.add(t)));
  return [...s].sort((a,b)=>a.localeCompare(b,'ko'));
}
function filteredChars(){
  const pool = W.showArch ? W.arch : W.chars;
  const q = W.query.trim().toLowerCase();
  return pool.filter(ch=>{
    if (q && !ch.name.toLowerCase().includes(q)) return false;
    if (W.filters.length){
      const tags = charAllTags(ch);
      if (!W.filters.every(t=>tags.has(t))) return false;
    }
    return true;
  });
}

function cardHTML(ch, opt={}){
  const costumes = ch.costumes;
  const imaged = costumes.filter(k=>k.art);
  const idx = Math.min(W.cardIdx[ch.id]||0, Math.max(0, imaged.length-1));
  const shown = imaged[idx] || null;
  const dDone = costumes.filter(k=>k.design==='done').length;
  const rDone = costumes.filter(k=>k.rig==='done').length;
  const hpx = opt.imgH;
  const style = hpx ? ` style="width:${Math.round(hpx*3/4)}px"` : '';
  const imgStyle = hpx ? ` style="height:${hpx}px;aspect-ratio:auto"` : '';
  const dots = imaged.length>1 ? `<div class="wheelDots">${imaged.map((k,i)=>`<i class="${i===idx?'on':''}"></i>`).join('')}</div>` : '';
  const hBadge = opt.refUnset ? `<span class="hBadge">키 미설정</span>` : '';
  const badges = costumes.length
    ? `<div class="badges"><span class="bdgD">디자인 ${dDone}/${costumes.length}</span><span class="bdgR">리깅 ${rDone}/${costumes.length}</span></div>`
    : `<div class="bdgEmpty">복장을 추가해주세요</div>`;
  const imgBox = opt.compact ? '' : `
    <div class="imgBox"${imgStyle}>
      ${shown ? artOf(shown, ch.h) : `<span class="noimg">${I('img',28)}</span>`}
      ${dots}${hBadge}
    </div>`;
  return `<button class="ccard${opt.pop?' pop':''}" data-cid="${ch.id}"${style}>
    ${imgBox}
    <div class="info">
      <div class="nm">${ch.name}</div>
      <div class="meta"><span>복장 ${costumes.length}</span>${ch.eps.length?`<span>· EP ${ch.eps.length}</span>`:''}</div>
      ${badges}
    </div>
  </button>`;
}
function listRowHTML(ch){
  const costumes = ch.costumes;
  const shown = costumes.find(k=>k.art) || null;
  const dDone = costumes.filter(k=>k.design==='done').length;
  const rDone = costumes.filter(k=>k.rig==='done').length;
  return `<button class="crow" data-cid="${ch.id}">
    <div class="th">${shown ? artOf(shown, ch.h) : `<span class="noimg" style="color:rgba(139,141,163,.4)">${I('img',16)}</span>`}</div>
    <div class="mid"><div class="nm">${ch.name}</div>
      <div class="sub">복장 ${costumes.length}${ch.eps.length?` · EP ${ch.eps.length}`:''}</div></div>
    ${costumes.length?`<div class="badges"><span class="bdgD">디자인 ${dDone}/${costumes.length}</span><span class="bdgR">리깅 ${rDone}/${costumes.length}</span></div>`:''}
  </button>`;
}
function tagPillHTML(tag, on, extra=''){
  const c = tagColor(tag);

function groupsHTML(tab, chars){
  const byId = new Map(chars.map(c=>[c.id,c]));
  const grouped = new Set();
  tab.groups.forEach(g=>g.ids.forEach(id=>grouped.add(id)));
  const ungrouped = chars.filter(c=>!grouped.has(c.id));
  const gridCls = W.view==='list' ? 'listWrap' : W.view==='compact' ? 'grid compact' : 'grid';
  const entry = (c)=> W.view==='list' ? listRowHTML(c) : cardHTML(c,{compact:W.view==='compact'});
  const section = (g)=>{
    const members = g ? g.ids.map(id=>byId.get(id)).filter(Boolean) : ungrouped;
    const empty = g ? '카드를 끌어다 놓아 배치해요' : '모든 캐릭터가 그룹에 배치됐어요';
    const head = g
      ? `<span class="gnm">${g.name}</span><span class="gcnt">${members.length}</span>
         <button class="gIco" data-act="gRename" data-gid="${g.id}">${I('pencil',12)}</button>
         <button class="gIco" data-act="gDel" data-gid="${g.id}">${I('x',12)}</button>`
      : `<span class="gnm">미분류</span><span class="gcnt">${members.length}</span>`;
    return `<section class="gsec" data-gid="${g?g.id:'__un__'}">
      <header>${head}</header>
      ${members.length ? `<div class="${gridCls}" style="padding-top:0">${members.map(entry).join('')}</div>`
        : `<div class="gEmpty">${empty}</div>`}
    </section>`;
  };

/* ── 메인 콘텐츠 ── */
function contentHTML(){
  const list = filteredChars();
  if (W.height){
    const withH = list.filter(c=>c.h);
    const maxH = Math.max(1, ...withH.map(c=>c.h||0));
    const sorted = [...list].sort((a,b)=>{
      if (a.h==null && b.h==null) return 0;
      if (a.h==null) return 1; if (b.h==null) return -1;
      return a.h - b.h;
    });
    return `<div class="lineup" id="grid">${sorted.map(c=>{
      const imgH = c.h ? Math.max(90, Math.min(300, Math.round(300*c.h/maxH))) : 170;
      return cardHTML(c,{imgH, refUnset:!c.h});
    }).join('')}</div>`;
  }
  const tab = W.activeTab ? W.btabs.find(t=>t.id===W.activeTab) : null;
  if (tab && !W.showArch) return groupsHTML(tab, list);
  if (!list.length){
    return `<div class="emptyState">${I('search',24)}<div>조건에 맞는 캐릭터가 없어요.</div>
      <button class="tbtn" id="btnResetFilter">검색·필터 초기화</button></div>`;
  }
  if (W.view==='list') return `<div class="listWrap" id="grid">${list.map(listRowHTML).join('')}</div>`;
  return `<div class="grid${W.view==='compact'?' compact':''}" id="grid">${list.map(c=>cardHTML(c,{compact:W.view==='compact'})).join('')}</div>`;
}

/* ═══════════════ 7. 오버레이: 캐릭터 상세 모달 ═══════════════ */
function railHTML(kind, current, costume){
  const order = kind==='design' ? DS_ORDER : RS_ORDER;
  const meta  = kind==='design' ? DS_META : RS_META;
  const label = kind==='design' ? '디자인 단계' : '리깅 단계';
  const curIdx = Math.max(0, order.indexOf(current));
  const curColor = meta[current].c;
  const ass = kind==='design' ? costume.dAss : costume.rAss;
  const assHTML = ass.length
    ? ass.map(n=>{const c=userColor(n);return `<span class="assChip" style="color:${c};box-shadow:inset 0 0 0 1px ${hexA(c,.45)}"><span class="adot" style="background:${c}"></span>${n}</span>`;}).join('')
    : `<button class="assPick" data-kind="${kind}">${I('plus',11)} ${label==='디자인 단계'?'디자인':'리깅'} 담당자</button>`;
  const nodes = order.map((k,i)=>{
    const m = meta[k];
    const passed = i < curIdx, isCur = i === curIdx, reached = i <= curIdx;
    const prevColor = i>0 ? meta[order[i-1]].c : m.c;
    const link = i>0 ? `<span class="link" style="${reached?`background:${prevColor}`:''}"></span>` : '';
    const nodeStyle = `background:${reached?m.c:'var(--card)'};border-color:${reached?m.c:'var(--bd)'};${isCur?`box-shadow:0 0 0 4px ${hexA(m.c,.2)}`:''}`;
    const inner = passed ? `<svg style="display:block" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`
      : isCur ? `<span class="core" style="display:block"></span>` : '';
    return `<button class="stg" data-rail="${kind}" data-stage="${k}">
      ${link}
      <span class="node" style="${nodeStyle}">${inner}</span>
      <span class="slb" style="${isCur?`color:${m.c}`:''}">${m.l}</span>
    </button>`;
  }).join('');
  return `<div class="rail" id="rail${kind==='design'?'D':'R'}">
    <div class="railHead">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="lb">${label}</span>
        <span class="cur" style="color:${curColor}">${meta[current].l}</span>
      </div>
      <div id="ass${kind==='design'?'D':'R'}">${assHTML}</div>
    </div>
    <div class="railTrack">${nodes}</div>
  </div>`;
}

/* ═══════════════ 9. 엔진: 가상 시계 + 트윈 ═══════════════ */
const CK = { t:0, rate:1, playing:false };
let tweens = [];
const easeIO  = p => p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
const easeO   = p => 1-Math.pow(1-p,3);
const easeOB  = p => { const c=1.70158, c3=c+1; return 1+c3*Math.pow(p-1,3)+c*Math.pow(p-1,2); };
const linear  = p => p;
function tween({dur, ease=easeIO, up, ct}){
  return new Promise(res=>{
    if (ct && ct.cancelled){ res(); return; }
    tweens.push({ t0:CK.t, dur:Math.max(1, Number.isFinite(dur)?dur:1), ease, up, res, ct });
  });
}
const wait = (ms, ct)=>tween({dur:ms, up:()=>{}, ct});
function stepTweens(){
  for (let i=tweens.length-1; i>=0; i--){
    const tw = tweens[i];
    if (tw.ct && tw.ct.cancelled){ tweens.splice(i,1); tw.res(); continue; }
    const p = Math.min(1, (CK.t - tw.t0)/tw.dur);
    try { tw.up(tw.ease(p), p); } catch(e){}
    if (p >= 1){ tweens.splice(i,1); tw.res(); }
  }
}

/* ═══════════════ 10. 무대 좌표 & 스케일 ═══════════════ */
const stage = document.getElementById('stage');
const stageWrap = document.getElementById('stageWrap');
function fitStage(){
  const deckH = document.getElementById('deck').offsetHeight + 40;
  const k = Math.min((window.innerWidth-32)/1280, (window.innerHeight-deckH-24)/720, 1.08);
  stage.style.transform = `scale(${k})`;
  stageWrap.style.width = (1280*k)+'px';
  stageWrap.style.height = (720*k)+'px';
}
window.addEventListener('resize', fitStage);
function rectOf(el){
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  const k = (s.width/1280) || 1;
  return { x:(r.left-s.left)/k, y:(r.top-s.top)/k, w:r.width/k, h:r.height/k };
}
const centerOf = el => { const r = rectOf(el); return { x:r.x+r.w/2, y:r.y+r.h/2 }; };

/* ═══════════════ 11. 카메라 (줌·확대 표시) ═══════════════ */
const camEl = document.getElementById('camera');
const cam = { x:0, y:0, k:1 };
function applyCam(){ camEl.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.k})`; }
async function camTo(tx, ty, tk, ct, dur=750){
  const f = { x:cam.x, y:cam.y, k:cam.k };
  await tween({dur, ease:easeIO, ct, up:p=>{
    cam.x = f.x+(tx-f.x)*p; cam.y = f.y+(ty-f.y)*p; cam.k = f.k+(tk-f.k)*p; applyCam();
  }});
}
async function zoomTo(el, k, ct, opt={}){
  // 대상 요소의 '월드 좌표' 중심을 무대 중앙(또는 지정점)으로.
  const r = rectOf(el);
  const wx = (r.x + r.w/2 - cam.x)/cam.k;
  const wy = (r.y + r.h/2 - cam.y)/cam.k;
  const cx = opt.cx ?? 640, cy = opt.cy ?? 360;
  await camTo(cx - wx*k, cy - wy*k, k, ct, opt.dur ?? 750);
}
const camReset = (ct, dur=650)=>camTo(0,0,1,ct,dur);
function camResetHard(){ cam.x=0; cam.y=0; cam.k=1; applyCam(); }

/* ═══════════════ 12. 커서 ═══════════════ */
const curEl = document.getElementById('cursor');
const cur = { x:660, y:420 };
function setCur(x,y){ cur.x=x; cur.y=y; curEl.style.transform = `translate(${x}px,${y}px)`; }
setCur(cur.x, cur.y);
async function cMove(x, y, ct, opt={}){
  const dist = Math.hypot(x-cur.x, y-cur.y);
  const dur = opt.dur ?? Math.max(260, Math.min(950, dist*1.5));
  const sx=cur.x, sy=cur.y;
  const mx=(sx+x)/2, my=(sy+y)/2;
  const nx=-(y-sy)/(dist||1), ny=(x-sx)/(dist||1);
  const amp = (opt.arc ?? .16) * dist * (Math.random()<.5?-1:1);
  const cx=mx+nx*amp, cy=my+ny*amp;
  await tween({dur, ease:easeIO, ct, up:p=>{
    const a=1-p;
    setCur(a*a*sx + 2*a*p*cx + p*p*x, a*a*sy + 2*a*p*cy + p*p*y);
  }});
}
async function cMoveEl(el, ct, opt={}){
  const r = rectOf(el);
  const x = r.x + r.w*(opt.ax ?? .5) + (opt.dx||0);
  const y = r.y + r.h*(opt.ay ?? .5) + (opt.dy||0);
  await cMove(x, y, ct, opt);
}
function ripple(x, y, ct){
  const d = document.createElement('div');
  d.className = 'ripple';
  document.getElementById('fx').appendChild(d);
  tween({dur:460, ease:easeO, ct, up:p=>{
    const s = .4 + p*2.6;
    d.style.transform = `translate(${x-7}px,${y-7}px) scale(${s})`;
    d.style.opacity = String(1-p);
  }}).then(()=>d.remove());
}
async function cPress(ct){ curEl.classList.add('press'); ripple(cur.x, cur.y, ct); await wait(95, ct); }
async function cRelease(ct){ curEl.classList.remove('press'); await wait(70, ct); }
async function cClick(elOrPt, ct, opt={}){
  if (elOrPt instanceof Element) await cMoveEl(elOrPt, ct, opt);
  else await cMove(elOrPt.x, elOrPt.y, ct, opt);
  await cPress(ct); await wait(50, ct); await cRelease(ct);
  await wait(opt.settle ?? 110, ct);
}
async function cDblClick(el, ct, opt={}){
  await cMoveEl(el, ct, opt);
  await cPress(ct); await cRelease(ct); await wait(70, ct);
  await cPress(ct); await cRelease(ct); await wait(110, ct);
}

/* ═══════════════ 13. 스포트라이트 (4분할 베일 + 링 + 빔) ═══════════════ */
const fx = document.getElementById('fx');
const fsT=$('#fsT'), fsB=$('#fsB'), fsL=$('#fsL'), fsR=$('#fsR'), fring=$('#fring');
const fbeamWrap=$('#fbeamWrap'), fbeam=$('#fbeam');
let focusT = null, focusPad = 8, focusR = 12;
const fState = { x:640, y:360, w:0, h:0, init:false };
function focusOn(el, opt={}){
  focusT = el; focusPad = opt.pad ?? 8; focusR = opt.r ?? 12;
  fring.style.borderRadius = focusR+'px';
  fx.classList.add('focusOn');
  if (!fState.init){
    const r = rectOf(el);
    fState.x=r.x-focusPad; fState.y=r.y-focusPad; fState.w=r.w+focusPad*2; fState.h=r.h+focusPad*2;
    fState.init = true; applyFocus(fState);
  }
  if (opt.beam) beamSweep();
}
function clearFocus(){ focusT = null; fx.classList.remove('focusOn'); fState.init = false; }
function applyFocus(s){
  fsT.style.cssText = `left:0;top:0;width:1280px;height:${Math.max(0,s.y)}px`;
  fsB.style.cssText = `left:0;top:${s.y+s.h}px;width:1280px;height:${Math.max(0,720-(s.y+s.h))}px`;
  fsL.style.cssText = `left:0;top:${s.y}px;width:${Math.max(0,s.x)}px;height:${s.h}px`;
  fsR.style.cssText = `left:${s.x+s.w}px;top:${s.y}px;width:${Math.max(0,1280-(s.x+s.w))}px;height:${s.h}px`;
  fring.style.cssText += `;left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px;border-radius:${focusR}px`;
}
function fxSync(){
  if (!focusT) return;
  if (!document.contains(focusT)){ return; }
  const r = rectOf(focusT);
  const tx=r.x-focusPad, ty=r.y-focusPad, tw=r.w+focusPad*2, th=r.h+focusPad*2;
  const a = .22;
  fState.x += (tx-fState.x)*a; fState.y += (ty-fState.y)*a;
  fState.w += (tw-fState.w)*a; fState.h += (th-fState.h)*a;
  applyFocus(fState);
}
async function beamSweep(ct){
  fbeamWrap.style.cssText = `left:${fState.x}px;top:${fState.y}px;width:${fState.w}px;height:${fState.h}px;opacity:1;border-radius:${focusR}px`;
  await tween({dur:820, ease:easeIO, ct, up:p=>{
    fbeamWrap.style.left = fState.x+'px'; fbeamWrap.style.top = fState.y+'px';
    fbeamWrap.style.width = fState.w+'px'; fbeamWrap.style.height = fState.h+'px';
    fbeam.style.left = (-40 + p*150)+'%';
  }});
  fbeamWrap.style.opacity = '0';
}
async function focusPulse(el, ct, opt={}){
  focusOn(el, opt);
  if (opt.beam !== false){ await wait(320, ct); beamSweep(ct); }
}

/* ═══════════════ 16. 타이핑 · 스크롤 · FLIP ═══════════════ */
async function typeIn(input, text, ct, opt={}){
  input.classList.add('hot');
  const isCE = input.getAttribute && input.getAttribute('contenteditable')==='true';
  for (let i=1; i<=text.length; i++){
    if (ct.cancelled) break;
    if (isCE) input.textContent = text.slice(0,i);
    else input.value = text.slice(0,i);
    await wait(46 + Math.random()*54, ct);
  }
  await wait(140, ct);
}
async function scrollTo(container, top, ct, dur=620){
  const from = container.scrollTop;
  await tween({dur, ease:easeIO, ct, up:p=>{ container.scrollTop = from + (top-from)*p; }});
}
async function scrollToEl(container, el, ct, opt={}){
  const cr = container.getBoundingClientRect(), er = el.getBoundingClientRect();
  const target = container.scrollTop + (er.top - cr.top) - (opt.offset ?? 90);
  await scrollTo(container, Math.max(0, target), ct, opt.dur ?? 620);
}
async function flip(container, mutate, ct, opt={}){
  const sel = opt.sel || '[data-cid],[data-gc]';
  const before = new Map();
  $$(sel, container).forEach(el=>before.set(el.dataset.cid||el.dataset.gc, rectOf(el)));
  mutate();
  const items = $$(sel, container);
  const moves = [];
  items.forEach(el=>{
    const key = el.dataset.cid||el.dataset.gc;
    const b = before.get(key);
    if (!b) return;
    const a = rectOf(el);
    const dx = (b.x-a.x)*cam.k, dy = (b.y-a.y)*cam.k;
    if (Math.abs(dx)<1 && Math.abs(dy)<1) return;
    el.style.transition = 'none';
    el.style.transform = `translate(${dx/cam.k}px,${dy/cam.k}px)`;
    moves.push(el);
  });
  if (!moves.length) return;
  await tween({dur:8, up:()=>{}, ct});
  moves.forEach(el=>{ el.style.transition = 'transform .42s cubic-bezier(.22,1,.36,1)'; el.style.transform = ''; });
  await wait(440, ct);
  moves.forEach(el=>{ el.style.transition = ''; });
}
function pressEffect(el){
  if (!el) return;
  el.style.transition = 'transform .12s';
  el.style.transform = 'scale(.96)';
  setTimeout(()=>{ el.style.transform=''; }, 130);
}

/* ═══════════════ 17. 메인 루프 ═══════════════ */
let lastTs = performance.now();
function loop(ts){
  const dt = Math.min(64, ts - lastTs); lastTs = ts;
  if (CK.playing) CK.t += dt * CK.rate;
  stepTweens();
  fxSync();
  moveGhost(); moveFileChip();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

async function wheelCycle(chId, ct, steps=2){

    const box = $('.imgBox', el); if (!box) return;

async function dragCharCard(srcId, dstId, edge, ct){
  const src = cardEl(srcId), dst0 = cardEl(dstId);
  if (!src || !dst0) return;
  const ch = findChar(srcId);
  await cMoveEl(src, ct, {ay:.42});
  await cPress(ct); grab(true);
  src.classList.add('dragSrc');
  showGhost(ch.name, artOf(featuredCostume(ch), ch.h));
  await wait(160, ct);
  const dst = cardEl(dstId);
  const r = rectOf(dst);
  await cMove(edge==='before' ? r.x+18 : r.x+r.w-18, r.y+r.h*.4, ct, {dur:760, arc:.1});
  dst.classList.add('dropHi');
  const line = document.createElement('span');
  line.className = 'dropLine '+edge;
  dst.appendChild(line);
  await wait(480, ct);
  grab(false); await cRelease(ct);
  hideGhost();
  dst.classList.remove('dropHi'); line.remove();
  src.classList.remove('dragSrc');
  const grid = $('#grid');
  await flip(grid, ()=>{
    if (edge==='before') grid.insertBefore(src, dst);
    else grid.insertBefore(src, dst.nextSibling);
  }, ct);
  const arr = W.chars;
  const si = arr.findIndex(c=>c.id===srcId);
  const [moved] = arr.splice(si,1);

  arr.splice(edge==='before' ? di : di+1, 0, moved);
}

    W.detail.commentOpen = false;

    await camReset(ct, 450);
    await cClick($('#dCloseB'), ct);

    await wait(350, ct);
    await say('14','MORE','에피소드 에셋 탭','같은 데이터를 <b>에피소드 기준</b>으로 보는 두 번째 탭. "이 편에 누가 나오고, 무슨 복장이고, 주의점은 뭔지"를 봐요.', ct);
    await cClick($('#tabEpisode'), ct);
    W.tab = 'episode'; render();
    await wait(400, ct);
    focusOn($('#epBoard'), {pad:8, beam:true});
    await wait(600, ct);
    await callout($('#epPicker'), '<b>에피소드 선택</b>', 'right', ct);
    await callout($('#epCast'), '이 편 <b>등장 캐릭터</b>', 'right', ct, {ay:.3});
    await callout($('#epDetail'), '이 편 복장 · <b>주의점 메모</b> · 리깅 연동', 'left', ct, {ay:.7});
    await say('14','MORE','현황판과 연결','여기서 <b>캐릭터 현황판에서 보기</b>를 누르면 방금 본 상세로 바로 점프해요.', ct);
    await cMoveEl($('#epJump'), ct);
    await wait(2200, ct);
    clearCallouts(); clearFocus();
    await cClick($('#tabBoard'), ct);
    W.tab = 'board'; render();
    await wait(300, ct);
    focusOn($('#btnNewWin'), {pad:6, beam:true});
    await say('14','MORE','새 창으로','현황판을 <b>별도 창</b>으로 띄워 두면, 다른 화면에서 작업하면서 나란히 볼 수 있어요.', ct);
    await cMoveEl($('#btnNewWin'), ct);
    await wait(2200, ct);
    clearFocus();
    await say('14','DONE','투어 끝!','카드부터 보관까지 — 캐릭터 현황판의 모든 기능을 봤어요. 이제 실제 데이터로 직접 만져보세요.', ct);
    await wait(2200, ct);
    capClear();
  }
},
];


/* ═══════════════ 19. 플레이어 ═══════════════ */
let sceneIdx = 0;
let token = null;                    // 취소 토큰: 장면을 갈아탈 때 이전 장면을 멈추는 스위치
const doneSet = new Set();
const raf2 = ()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

const elIntro = $('#intro'), elOutro = $('#outro');
const pfill = $('#pfill'), chipsEl = $('#chips');
const icoPlay = $('#icoPlay'), icoPause = $('#icoPause');

function gateVisible(){ return !elIntro.classList.contains('hide') || !elOutro.classList.contains('hide'); }
function hideGates(){ elIntro.classList.add('hide'); elOutro.classList.add('hide'); }
function showOutro(){
  CK.playing = false; syncPlayBtn();
  pfill.style.width = '100%';
  elOutro.classList.remove('hide');
}

function syncPlayBtn(){
  icoPlay.style.display  = CK.playing ? 'none' : '';
  icoPause.style.display = CK.playing ? '' : 'none';
}

/* ── 덱: 칩 + 진행바 ── */
function buildChips(){
  chipsEl.innerHTML = SCENES.map((s,i)=>
    `<button class="chip" data-i="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span>${s.chip}</button>`).join('');
  $$('#chips .chip').forEach(b=>b.addEventListener('click', ()=>playScene(+b.dataset.i)));
}
function updateDeck(finished){
  $$('#chips .chip').forEach((b,i)=>{
    b.classList.toggle('on', i===sceneIdx);
    b.classList.toggle('done', doneSet.has(SCENES[i].id));
  });
  const p = ((sceneIdx + (finished?1:0)) / SCENES.length) * 100;
  pfill.style.width = p + '%';
}

/* ── 게이트 콘텐츠 ── */
function buildIntroChips(){
  $('#introChips').innerHTML = SCENES.map(s=>`<span class="gChip">${s.chip}</span>`).join('');
}
function buildOutroGrid(){
  const feats = [
    '카드 보기 · 카드 휠', '리스트 · 키 비교 보기', '드래그 정렬 · 그룹',
    '검색 · 태그 필터', '캐릭터 추가 · 보드 탭', '복장 · 버전 · 마감일',
    '디자인/리깅 단계 레일', '에피소드 연결 · 작업 경로', '보관 · 복원 · 댓글',
  ];
  $('#outroGrid').innerHTML = feats.map(f=>`<div class="gCell">${I('check',15)}<span>${f}</span></div>`).join('');
}

/* ── 장면 재생 ──
   흐름: 이전 토큰 취소 → 두 프레임 기다려 이전 장면 코루틴이 빠져나가게 함
        → setup()으로 월드 초기화 → run(ct) 실행 → 끝나면 다음 장면으로. */
async function playScene(i){
  if (token) token.cancelled = true;
  const ct = token = { cancelled:false };
  sceneIdx = Math.max(0, Math.min(i, SCENES.length - 1));
  hideGates();
  CK.playing = true; syncPlayBtn();
  await raf2();                       // 이전 장면 정리 대기
  if (ct.cancelled) return;
  const sc = SCENES[sceneIdx];
  try { sc.setup ? sc.setup() : (W = baseW(), render()); }
  catch(e){ console.error('[setup]', sc.id, e); }
  updateDeck(false);
  await raf2();                       // 레이아웃 확정 후 좌표 계산이 정확해짐
  if (ct.cancelled) return;
  try { await sc.run(ct); }
  catch(e){ if (!ct.cancelled) console.error('[run]', sc.id, e); }
  if (ct.cancelled) return;
  doneSet.add(sc.id);
  updateDeck(true);
  if (sceneIdx + 1 < SCENES.length) playScene(sceneIdx + 1);
  else showOutro();
}

/* ── 트랜스포트 ── */
$('#btnPlay').addEventListener('click', ()=>{
  if (!elIntro.classList.contains('hide')){ playScene(0); return; }
  if (!elOutro.classList.contains('hide')){ playScene(0); return; }
  CK.playing = !CK.playing; syncPlayBtn();
});
$('#btnPrev').addEventListener('click', ()=>playScene(sceneIdx - 1));
$('#btnNext').addEventListener('click', ()=>{
  if (sceneIdx + 1 >= SCENES.length) showOutro();
  else playScene(sceneIdx + 1);
});
const SPEEDS = [1, 1.5, 2];
let speedIdx = 0;
$('#btnSpeed').addEventListener('click', ()=>{
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  CK.rate = SPEEDS[speedIdx];
  $('#btnSpeed').textContent = SPEEDS[speedIdx].toFixed(1) + '×';
});

/* ── 키보드 ── */
window.addEventListener('keydown', e=>{
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.code === 'Space'){ e.preventDefault(); $('#btnPlay').click(); }
  else if (e.code === 'ArrowLeft'){ $('#btnPrev').click(); }
  else if (e.code === 'ArrowRight'){ $('#btnNext').click(); }
});

/* ── 게이트 버튼 ── */
$('#btnStart').addEventListener('click', ()=>playScene(0));
$('#btnReplay').addEventListener('click', ()=>{ doneSet.clear(); playScene(0); });

/* ── 초기화 ── */
buildChips();
buildIntroChips();
buildOutroGrid();
render();               // 인트로 뒤에서도 실제 화면이 준비돼 있도록
fitStage();
syncPlayBtn();
CK.playing = false;     // 시작 전에는 정지 상태
syncPlayBtn();

</script>
